name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/website-deployment-7u69nj
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Requires Pages to be enabled once by hand:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # (enablement:true is not usable here — the workflow GITHUB_TOKEN gets
      # "Resource not accessible by integration" on the create-Pages-site call.)
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
